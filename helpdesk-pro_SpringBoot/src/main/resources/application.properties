#MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk_pro?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=abc123.

#Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#Configuracion_Apliacion
springdoc.api-docs.path=/api-helpdesk-pro

spring.application.name=helpdesk-pro

#JWT
jwt.secreto=helpdesk-pro-clave-de-desarrollo-2026-cambiar-en-produccion
jwt.duracion-ms=86400000

# Gmail SMTP (usar una contrasena de aplicacion, no la contrasena normal)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.remitente=${GMAIL_FROM:${spring.mail.username}}
# Solo para pruebas: redirige todos los codigos de recuperacion a este correo.
app.mail.recuperacion-destinatario=${GMAIL_RECOVERY_TO:}
