#MYSQL (los valores por defecto son los de desarrollo local;
#en Docker se sobrescriben con las variables DB_URL, DB_USER y DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helpdesk_pro?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:abc123.}

#Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#Configuracion_Apliacion
springdoc.api-docs.path=/api-helpdesk-pro

spring.application.name=helpdesk-pro

#JWT (sobrescribible con variables de entorno en Docker)
jwt.secreto=${JWT_SECRETO:helpdesk-pro-clave-de-desarrollo-2026-cambiar-en-produccion}
jwt.duracion-ms=${JWT_DURACION_MS:86400000}

# Gmail SMTP (usar una contrasena de aplicacion, no la contrasena normal)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.remitente=${GMAIL_FROM:${spring.mail.username}}
# Solo para pruebas: redirige todos los codigos de recuperacion a este correo.
app.mail.recuperacion-destinatario=${GMAIL_RECOVERY_TO:}

resend.api.key=${RESEND_API_KEY:}
app.mail.resend.remitente=${GMAIL_FROM:onboarding@resend.dev}
